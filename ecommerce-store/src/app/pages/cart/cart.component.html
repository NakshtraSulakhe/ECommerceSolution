<div class="container mt-4">

  <h2>Your Cart 🛒</h2>
  <hr />

  <div *ngIf="cart.length === 0" class="text-center text-muted fs-4 mt-5">
    Your cart is empty 🙁
  </div>

  <div *ngFor="let item of cart" class="cart-item shadow-sm">

    <img [src]="item.imageUrl" class="item-img">

    <div class="details">
      <h5>{{ item.name }}</h5>
      <p>₹ {{ item.price }}</p>

      <div class="qty-controls">
        <button class="btn btn-sm btn-outline-secondary" (click)="decrease(item.id)">-</button>

        <span class="qty-box">{{ item.qty }}</span>

        <button class="btn btn-sm btn-outline-secondary" (click)="increase(item.id)">+</button>
      </div>
    </div>

    <button class="btn btn-danger ms-3" (click)="remove(item.id)">
      Remove
    </button>

  </div>

  <!-- Cart Total -->
  <div class="cart-total mt-4 p-3 shadow-sm">
    <h4>Total: ₹ {{ total }}</h4>

    <button class="btn btn-success btn-lg w-100 mt-2">
      Proceed to Checkout
    </button>
  </div>

</div>
