<div *ngIf="banner" class="mb-3">
  <img [src]="banner.imageUrl" class="img-fluid rounded shadow">
</div>

<h2>Category: {{ categoryId }}</h2>
<div class="container mt-4">

  <div *ngIf="banner" class="mb-4">
    <img [src]="banner.imageUrl" class="img-fluid rounded">
  </div>

  <h2 class="mb-3">Products</h2>

  <div class="row g-3">
    <div class="col-6 col-md-3" *ngFor="let p of products">
      <app-product-card [product]="p"></app-product-card>
    </div>
  </div>

</div>
