<div class="container mt-4">

  <h2>Checkout</h2>
  <hr />

  <div class="row">

    <!-- Customer Details -->
    <div class="col-md-6">
      <h4>Billing Details</h4>

      <div class="mb-3">
        <label>Name</label>
        <input class="form-control" [(ngModel)]="name">
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input class="form-control" [(ngModel)]="email">
      </div>

      <div class="mb-3">
        <label>Phone</label>
        <input class="form-control" [(ngModel)]="phone">
      </div>

      <div class="mb-3">
        <label>Address</label>
        <textarea class="form-control" rows="3" [(ngModel)]="address"></textarea>
      </div>

    </div>

    <!-- Order Summary -->
    <div class="col-md-6">

      <h4>Order Summary</h4>

      <div *ngFor="let item of cart" class="summary-item">
        <span>{{ item.name }} (x{{ item.qty }})</span>
        <span>₹ {{ item.price * item.qty }}</span>
      </div>

      <hr />
      <h4>Total: ₹ {{ total }}</h4>

      <button class="btn btn-success btn-lg w-100 mt-3" (click)="placeOrder()"
              [disabled]="cart.length === 0">
        Place Order
      </button>

    </div>

  </div>
</div>
